unleash:
  enabled: true

prosessering:
  continuousRunning.enabled: true
  fixedDelayString:
    in:
      milliseconds: 15000
  delete:
    after:
      weeks: 16

# Pilot: no.nav.efterlatte:prosessering-spring-boot-starter, kun brukt av skyggekjøringInfotrygd-task inntil videre.
efterlatte-prosessering:
  node: ${HOSTNAME:ukjent-node}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    oauth:
      use-pkce-with-authorization-code-grant: true
      client-id: ${AZURE_APP_CLIENT_ID}
      scope-separator: ","
    disable-swagger-default-url: true
    persist-authorization: true